connections {
   rw {
      local_addrs  = 192.168.0.1
      pools = rw_pool
      local {
         auth = pubkey
         certs = moonCert.pem
         id = moon.strongswan.org
      }
      remote {
         auth = pubkey
      }
      children {
         rw {
            local_ts  = 0.0.0.0/0
            updown = /usr/local/libexec/ipsec/_updown iptables
            esp_proposals = aes128gcm128-x25519
         }
      }
      version = 2
      proposals = aes128-sha256-x25519
   }
}

pools {
   rw_pool {
      addrs = 10.3.0.0/24
   }
}
